<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Crédito — Login</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="brand"><img src="logo.png" alt="MM Crédito"></div>
      <div class="sub">Acesso de consultores</div>

      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="username">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btnEntrar" style="width:100%;">Entrar</button>
      <div class="error-msg" id="erro"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const btn = document.getElementById("btnEntrar");
    const erroEl = document.getElementById("erro");

    function comTimeout(promessa, ms) {
      return Promise.race([
        promessa,
        new Promise((_, reject) => setTimeout(() => reject(new Error("Tempo esgotado (sem resposta do servidor)")), ms)),
      ]);
    }

    async function tentarLogin() {
      erroEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      if (!email || !senha) {
        erroEl.textContent = "Preencha e-mail e senha.";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        const { data, error } = await comTimeout(supabaseClient.auth.signInWithPassword({ email, password: senha }), 15000);
        if (error) {
          erroEl.textContent = "E-mail ou senha inválidos. (" + error.message + ")";
          btn.disabled = false;
          btn.textContent = "Entrar";
          return;
        }

        const { data: profile, error: perfilErro } = await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", data.user.id)
          .single();

        if (perfilErro || !profile || !profile.ativo) {
          erroEl.textContent = perfilErro
            ? "Erro ao buscar perfil: " + perfilErro.message
            : "Usuário sem acesso liberado. Fale com o administrador.";
          await supabaseClient.auth.signOut();
          btn.disabled = false;
          btn.textContent = "Entrar";
          return;
        }

        window.location.href = profile.role === "admin" ? "admin.html" : "consultor.html";
      } catch (e) {
        erroEl.textContent = "Erro de conexão: " + (e && e.message ? e.message : e);
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    }

    btn.addEventListener("click", tentarLogin);
    document.getElementById("senha").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tentarLogin();
    });

    // se já estiver logado, manda direto
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
        if (profile && profile.ativo) {
          window.location.href = profile.role === "admin" ? "admin.html" : "consultor.html";
        }
      }
    })();
  </script>
</body>
</html>
